<div class="max-w-sm bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
  <!-- Image -->
  <img
    src="{{product().thumbnail}}"
    alt="photo"
    class="w-full h-48 object-cover"
  />

  <!-- Content -->
  <div class="p-4 space-y-3">
    <!-- Title & Brand -->
    <div>
      <h2 class="text-lg font-semibold text-gray-800">
        {{product().title}}
      </h2>
      <p class="text-sm text-gray-500">Brand: Essence</p>
    </div>

    <!-- Description -->
    <p class="text-sm text-gray-600 line-clamp-3">
      {{product().description}}
    </p>

    <!-- Price & Discount -->
    <div class="flex items-center justify-between">
      <span class="text-xl font-bold text-green-600">${{product().price}}</span>
      <span class="text-sm text-red-500 font-medium">
        {{product().discountPercentage}}% Off
      </span>
    </div>

    <!-- Rating & Stock -->
    <div class="flex items-center justify-between text-sm">
      <span class="text-yellow-500 font-medium">
        ⭐ {{product().rating}}
      </span>
      <span class="text-green-600 font-medium">
        In Stock {{product().stock}}
      </span>
    </div>

    <!-- Extra Info -->
    <div class="text-xs text-gray-500 space-y-1">
      <p>Warranty: {{product().warrantyInformation}}</p>
      <p>Shipping: {{product().shippingInformation}}</p>
      <p>SKU: BEA-ESS-ESS-001</p>
    </div>

    <!-- Button -->
    <button
      class="w-full mt-3 bg-black text-white py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition"
    >
      Add to Cart
    </button>
  </div>
</div>
