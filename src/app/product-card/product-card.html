<div class="group relative w-full max-w-[320px] bg-white rounded-[2rem] shadow-[0_10px_30px_rgba(0,0,0,0.03)] border border-gray-100 overflow-hidden hover:shadow-[0_20px_50px_rgba(0,0,0,0.1)] transition-all duration-500">
  
  <div class="absolute top-4 left-4 z-10 flex flex-col gap-2">
    <span class="bg-red-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow-lg">
      {{product().discountPercentage}}% OFF
    </span>
    <span class="bg-white/80 backdrop-blur-md text-gray-800 text-[10px] font-bold px-2.5 py-1 rounded-full shadow-sm border border-white/50">
      {{product().rating}} ⭐
    </span>
  </div>

  <div class="relative h-64 overflow-hidden bg-gray-50">
    <img
      src="{{product().thumbnail}}"
      alt="{{product().title}}"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
    />
    <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
  </div>

  <div class="p-6">
    <div class="mb-3">
      <p class="text-[10px] font-black uppercase tracking-[0.15em] text-indigo-500 mb-1">Essence</p>
      <h2 class="text-xl font-bold text-gray-800 leading-tight group-hover:text-indigo-600 transition-colors">
        {{product().title}}
      </h2>
    </div>

    <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed mb-4">
      {{product().description}}
    </p>

    <div class="flex items-end justify-between mb-4">
      <div>
        <p class="text-[10px] text-gray-400 font-bold uppercase mb-0.5">Price</p>
        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-black text-gray-900">${{product().price}}</span>
          <span class="text-[10px] text-gray-400 line-through font-medium">$120.00</span> </div>
      </div>
      <div class="text-right">
        <span class="inline-flex items-center text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">
           <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 animate-pulse"></span>
           {{product().stock}} In Stock
        </span>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-2 py-4 border-t border-gray-50 text-[10px] font-medium text-gray-500 uppercase tracking-tighter">
        <div class="flex justify-between uppercase">
            <span>Warranty</span>
            <span class="text-gray-800">{{product().warrantyInformation}}</span>
        </div>
        <div class="flex justify-between uppercase">
            <span>Shipping</span>
            <span class="text-gray-800">{{product().shippingInformation}}</span>
        </div>
        <div class="flex justify-between text-[9px] opacity-60">
            <span>SKU</span>
            <span>BEA-ESS-ESS-001</span>
        </div>
    </div>

    <button class="w-full mt-2 relative group/btn overflow-hidden bg-black text-white py-4 rounded-2xl text-xs font-bold transition-all hover:shadow-xl active:scale-95">
      <span class="relative z-10">ADD TO CART</span>
      <div class="absolute inset-0 bg-indigo-600 translate-y-full group-hover/btn:translate-y-0 transition-transform duration-300"></div>
    </button>
  </div>
</div>
