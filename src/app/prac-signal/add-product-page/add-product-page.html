<h2 class="text-2xl font-bold text-black text-center">Add Product</h2>

<form
  [formGroup]="productForm"
  (ngSubmit)="addProducts()"
  class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-200"
>

  <h2 class="text-2xl font-bold mb-5 text-gray-800">
    Add Product
  </h2>

  <!-- Title -->
  <input
    type="text"
    placeholder="Product Title"
    formControlName="title"
    class="w-full mb-4 px-4 py-2 border border-gray-300 rounded-lg
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <!-- Description -->
  <textarea
    placeholder="Product Description"
    formControlName="description"
    rows="3"
    class="w-full mb-4 px-4 py-2 border border-gray-300 rounded-lg
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  ></textarea>

  <!-- Price -->
  <input
    type="number"
    placeholder="Price"
    formControlName="price"
    class="w-full mb-6 px-4 py-2 border border-gray-300 rounded-lg
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <!-- Button -->
  <button
    type="submit"
    class="w-full bg-blue-600 hover:bg-blue-700
           text-white font-semibold py-2 rounded-lg
           transition"
  >
    Add Product
  </button>

</form>

<!-- show card of product -->

<h2 class="text-2xl font-bold mb-4 mx-auto text-center pt-4">Products</h2>

@for (product of products; track product._id) {
  <div class="bg-white max-w-xs mx-auto rounded-2xl shadow-md border border-gray-200 p-5 mb-4 hover:shadow-lg transition">

    <h3 class="text-lg font-semibold text-gray-800">
      {{ product.title }}
    </h3>

    <p class="text-gray-600 mt-2">
      {{ product.description }}
    </p>

    <p class="text-xl font-bold text-green-600 mt-3">
      ₹ {{ product.price }}
    </p>

    <button
      class="mt-4 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg"
      (click)="deleteProduct(product._id)"
    >
      Delete
    </button>

  </div>
}
