<h2 class="text-2xl font-bold text-black text-center pb-10">Add Product Now </h2>

<form
  [formGroup]="productForm"
  (ngSubmit)="addProducts()"
  class="w-full mx-auto max-w-md bg-white border border-gray-200 rounded-2xl shadow-xl p-6 space-y-5"
>
  <!-- Heading -->
  <h2 class="text-2xl font-extrabold text-gray-800 text-center">
    Add New Product
  </h2>

  <!-- Title -->
  <div class="space-y-1">
    <label class="text-sm font-semibold text-gray-600">
      Product Title
    </label>
    <input
      type="text"
      placeholder="Enter product title"
      formControlName="title"
      class="w-full px-4 py-2 rounded-xl border border-gray-300
             focus:outline-none focus:ring-2 focus:ring-blue-500
             transition"
    />
  </div>

  <!-- Description -->
  <div class="space-y-1">
    <label class="text-sm font-semibold text-gray-600">
      Description
    </label>
    <textarea
      placeholder="Enter product description"
      formControlName="description"
      rows="3"
      class="w-full px-4 py-2 rounded-xl border border-gray-300
             focus:outline-none focus:ring-2 focus:ring-blue-500
             transition resize-none"
    ></textarea>
  </div>

  <!-- Price -->
  <div class="space-y-1">
    <label class="text-sm font-semibold text-gray-600">
      Price (₹)
    </label>
    <input
      type="number"
      placeholder="Enter price"
      formControlName="price"
      class="w-full px-4 py-2 rounded-xl border border-gray-300
             focus:outline-none focus:ring-2 focus:ring-blue-500
             transition"
    />
  </div>

  <!-- Button -->
  <button
    
    type="submit"
    [disabled]="productForm.invalid"
    class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl
           transition-all duration-300
           hover:bg-blue-700 hover:scale-[1.02]
           disabled:bg-gray-300 disabled:cursor-not-allowed
           disabled:hover:scale-100"
  
           >
    Add Product
  </button>
</form>
