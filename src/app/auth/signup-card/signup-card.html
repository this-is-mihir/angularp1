<div class="flex items-center justify-center min-h-screen  p-8">
    
    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-[3rem] p-12 shadow-[0_40px_80px_-15px_rgba(0,0,0,0.08)]">
        
        <div class="flex flex-col gap-3 p-2">
            <h2 class="text-4xl font-black text-slate-900 tracking-tighter uppercase">Start your <span class="text-blue-600">way</span></h2>
            <p class="text-slate-500 font-medium">Create an account </p>
        </div>

        <div class="flex flex-col gap-5 p-2">
            
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex-1 flex flex-col gap-2 p-1">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-1">First Name</label>
                    <input type="text" placeholder="Raj" 
                        class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 outline-none transition-all duration-300 shadow-sm">
                </div>
                <div class="flex-1 flex flex-col gap-2 p-1">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-1">Last Name</label>
                    <input type="text" placeholder="Sharma" 
                        class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 outline-none transition-all duration-300 shadow-sm">
                </div>
            </div>

            <div class="flex flex-col gap-2 p-1">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-1">Email Address</label>
                <input type="email" placeholder="raj@123.com" 
                    class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 outline-none transition-all duration-300 shadow-sm">
            </div>

            <div class="flex flex-col gap-2 p-1">
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-1">Password</label>
                <input type="password" placeholder="Min. 8 characters" 
                    class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 outline-none transition-all duration-300 shadow-sm">
            </div>

            <div class="flex items-center gap-3 p-3">
                <input type="checkbox" class="w-5 h-5 rounded border-slate-300 cursor-pointer">
                <span class="text-slate-500 text-sm font-medium">I agree to the <span class="text-slate-900 underline">Terms of Service</span></span>
            </div>

            <div class="flex flex-col gap-4 p-2">
                <button class="w-full p-5 bg-blue-600 text-white font-black rounded-2xl hover:bg-blue-700 hover:shadow-2xl hover:shadow-blue-200 active:scale-95 transition-all duration-300">
                   Sign-up 
                </button>
                
                <p class="text-center text-slate-500 text-sm p-2">
                    Already have an account? 
                    <button routerLink="/login" class="text-blue-600 font-bold hover:underline transition-all">Sign In</button>
                </p>
            </div>
        </div>
    </div>
</div>
