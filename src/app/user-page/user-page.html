<div class="container mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 justify-items-center">

      @let userData = user();
      @for (item of userData.users; track $index) {
        <div class="w-full flex justify-center">
          <app-user-card [user]="item"></app-user-card>
        </div>
      }


    </div>
